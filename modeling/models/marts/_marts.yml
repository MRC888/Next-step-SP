version: 2

models:
  - name: fct_demonstracoes
    description: >
      Demonstrações financeiras limpas (BPA, BPP, DRE, DFC) de DFP e ITR, em reais.
      Grão: empresa x documento (tipo_doc, dt_refer) x demonstração x período x conta.
      Só o exercício atual, sem duplicatas, consolidado quando existe.
    columns:
      - name: tipo_doc
        description: DFP (anual) ou ITR (trimestral).
        data_tests:
          - accepted_values:
              arguments:
                values: ["DFP", "ITR"]
      - name: demonstracao
        description: BPA (ativo), BPP (passivo + PL), DRE (resultado), DFC_MD / DFC_MI (fluxo de caixa, método direto / indireto).
        data_tests:
          - accepted_values:
              arguments:
                values: ["BPA", "BPP", "DRE", "DFC_MD", "DFC_MI"]
      - name: escopo
        description: con (consolidado) ou ind (individual).
        data_tests:
          - accepted_values:
              arguments:
                values: ["con", "ind"]
      - name: cnpj
        description: CNPJ da companhia, como a CVM publica (com pontuação).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_empresa')
                field: cnpj
              config:
                severity: warn
      - name: cd_cvm
        description: Código da companhia na CVM.
      - name: nome_empresa
        description: Nome da companhia como consta no documento.
      - name: versao
        description: Versão do documento (sobe quando a empresa reenvia um balanço corrigido).
      - name: dt_refer
        description: Data de referência do documento (fim do trimestre ou do ano).
        data_tests:
          - not_null
      - name: dt_entrega
        description: Data em que o documento foi entregue à CVM. Usar no ML para não "ver o futuro".
        data_tests:
          - not_null
      - name: dt_ini_exerc
        description: Início do período (DRE e DFC). Nulo no balanço.
      - name: dt_fim_exerc
        description: Fim do período, ou a data da foto, no balanço.
      - name: meses_periodo
        description: Meses cobertos pelo valor (DRE/DFC). Nulo no balanço, que é posição numa data.
      - name: cd_conta
        description: >
          Código da conta no plano da CVM (ex.: 3.01 = receita; 2.03 = patrimônio líquido).
          Atenção: linhas de total podem vir erradas da fonte (ver excecoes_conhecidas);
          nas métricas, preferir somar as contas filhas.
        data_tests:
          - not_null
      - name: ds_conta
        description: Nome da conta.
      - name: nivel_conta
        description: Profundidade da conta na árvore (3.01 = 2; 3.01.01 = 3).
      - name: conta_fixa
        description: Verdadeiro para contas do plano padrão da CVM.
      - name: valor
        description: Valor em reais (lucro por ação em R$ por ação).

  - name: dim_empresa
    description: >
      Uma linha por empresa (CNPJ), da última foto do cadastro da CVM. Inclui empresas canceladas.
      23 CNPJs com balanço não aparecem no cadastro (aviso no teste de relação da fct_demonstracoes).
    columns:
      - name: cnpj
        data_tests:
          - unique
          - not_null
      - name: setor
        description: Setor de atividade informado à CVM.
      - name: plano_contas
        description: >
          instituicao_financeira, seguradora ou empresa_geral. Define como ler as contas da DRE.
          Nulo para empresas sem DRE na DFP (em geral, canceladas antes de 2010).
        data_tests:
          - accepted_values:
              arguments:
                values: ["instituicao_financeira", "seguradora", "empresa_geral"]
      - name: situacao_emissor
        description: Situação na CVM (fase operacional, recuperação judicial, falida etc.).
      - name: em_dificuldade_financeira
        description: Situação atual de recuperação, falência ou liquidação. Candidato a rótulo do ML.

  - name: fct_contas_anuais
    description: >
      Base da camada semântica: uma linha por empresa e ano (DFP), só empresas comerciais e industriais.
      Valores oficiais = totais publicados pela empresa; colunas *_pelas_filhas = soma das contas filhas, para
      conferência. dados_consistentes = false quando algum total diverge da soma (tolerância: R$ 1.000 ou 0,1%).
      As métricas usam só os documentos consistentes.
    data_tests:
      - unique:
          arguments:
            column_name: "cnpj || '|' || dt_refer"
    columns:
      - name: dados_consistentes
        description: Verdadeiro quando todos os totais batem com a soma das contas filhas.
        data_tests:
          - not_null
      - name: ir_csll
        description: IR e CSLL do exercício (conta 3.08), negativo quando é despesa.
      - name: divida_bruta
        description: Empréstimos e financiamentos de curto (2.01.04) e longo prazo (2.02.01).
      - name: passivo_total_informado
        description: Conta 2 como a empresa publicou. Não usada nas métricas (na Itapebi 2021 veio sem o PL).

  - name: fct_risco_features
    description: >
      Base do modelo de risco (Marco D): uma linha por empresa e ano, com os sinais do balanço já público e o alvo
      (entrar em dificuldade financeira em até 24 meses após a entrega). Sem vazamento de futuro. O nome da empresa
      nos documentos é o nome ATUAL (não histórico) e por isso não é usado como sinal nem como data de evento.
    data_tests:
      - unique:
          arguments:
            column_name: "cnpj || '|' || dt_refer"
    columns:
      - name: alvo
        description: 1 se entrou em recuperação, falência ou liquidação em até N meses após a entrega (var horizonte_risco_meses).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: janela_completa
        description: Verdadeiro quando os N meses já passaram (o alvo é conhecido). Linhas falsas não entram no treino nem no teste.
      - name: z_altman
        description: Z'' de Altman. Abaixo de 1,1 = zona de perigo; acima de 2,6 = zona segura.
