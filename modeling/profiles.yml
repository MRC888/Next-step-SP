# Conexão do dbt com o banco. Sem senha aqui: vem do .env (POSTGRES_PASSWORD) ou, se vazia, do ~/.pgpass.
sp_data:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'sp_data') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', '') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'sp_data') }}"
      schema: public
      threads: 4
