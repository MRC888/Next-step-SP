# Projeto dbt: transforma o schema raw (dados como vieram da CVM) em tabelas limpas e testadas.
name: sp_data
version: "1.0.0"
profile: sp_data

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Documentos que entram na limpeza. A fatia fina (só DFP) chegou ao dashboard; desde 30/10/2026 o ITR
  # também entra por padrão (build completo em ~4 min). Só DFP: dbt build --vars '{docs: [dfp]}'
  docs: ["dfp", "itr"]
  # Modelo de risco: o alvo é entrar em dificuldade em até N meses depois de publicar o balanço.
  # 24 meses: um alerta antecipado (12 meses deixava só 18 casos reais; ver nota do Obsidian, Marco D).
  horizonte_risco_meses: 24

models:
  sp_data:
    # staging e intermediate são views: não ocupam disco e sempre refletem o raw atual.
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    # marts são tabelas: é o que as consultas, a camada semântica e o ML vão ler, então precisam ser rápidas.
    marts:
      +schema: marts
      +materialized: table
    # Camada semântica: calendário do MetricFlow (as regras das métricas ficam no YAML desta pasta).
    semantic:
      +schema: marts
      +materialized: table

seeds:
  sp_data:
    # Listas fixas escritas à mão (CSV), carregadas no schema "seeds".
    +schema: seeds
    excecoes_conhecidas:
      +column_types:
        dt_refer: date
        dt_registro: date
