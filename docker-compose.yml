# Banco do projeto rodando em container.
# Porta 5433 no Mac para não conflitar com o PostgreSQL 18 já instalado (porta 5432).
services:
  postgres:
    image: postgres:17
    container_name: sp_data_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
